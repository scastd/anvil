[project]
site_name = "Anvil"
site_url = "https://scastd.github.io/anvil/"
site_description = "Java annotation processor for generating data classes from JSON schemas"
site_author = "Samuel Castrillo"
copyright = "Copyright &copy; 2025 Samuel Castrillo"
docs_dir = "docs"
site_dir = "site"
edit_uri = "edit/main/docs/"
repo_url = "https://github.com/scastd/anvil"
repo_name = "scastd/anvil"
nav = [
    { "Home" = "index.md" },
    { "Getting Started" = "getting-started.md" },
    { "Guides" = [
        { "Core Concepts" = "core-concepts.md" },
        { "Annotations" = "annotations.md" },
        { "Validators" = "validators.md" },
        { "Processors" = "processors.md" },
        { "Error Handling" = "error-handling.md" },
    ]},
    { "Usage Examples" = "usage-examples.md" },
    { "Release Notes" = "release-notes.md" },
]

[project.markdown_extensions.pymdownx.blocks.caption]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.highlight]
pygments_lang_class = true
#linenums = true
anchor_linenums = true
line_spans = "__span"
linenums_style = "pymdownx-inline"
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.footnotes]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.extra]
social = [
    { icon = "fontawesome/brands/github", link = "https://github.com/scastd" },
    { icon = "fontawesome/brands/x-twitter", link = "https://x.com/Samuelete_26" },
    { icon = "fontawesome/brands/linkedin", link = "https://www.linkedin.com/in/scastd/" }
]
#alternate = [
#    { name = "English", link = "/en/", lang = "en" },
#    { name = "Spanish", link = "/es/", lang = "es" }
#]

[project.theme]
logo = "assets/logo.png"
favicon = "assets/logo.png"
variant = "modern"
font.text = "Inter"
font.code = "JetBrains Mono"
language = "en"
icon.repo = "fontawesome/brands/github"
features = [
    "announce.dismiss",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.tabs.link",
    "navigation.sections",
    "navigation.expand",
    "navigation.top",
    "navigation.footer",
    "navigation.path",
    "search.suggest",
    "search.highlight",
    "code.copy",
    "code.annotate",
    "toc.follow",
    "content.action.edit",
    "content.action.view",
    "content.tabs.link",
    "content.code.copy",
]

# Toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"
primary = "purple"
accent = "purple"

# Toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "purple"
accent = "purple"

# Toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "purple"
accent = "purple"
