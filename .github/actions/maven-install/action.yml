name: 'Maven Install'
description: 'Runs mvn clean install with optional test skipping'

inputs:
  skip-tests:
    description: 'Skip tests during install'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install modules to local repository
      shell: bash
      run: |
        if [ "${{ inputs.skip-tests }}" = "true" ]; then
          mvn clean install -B -DskipTests
        else
          mvn clean install -B
        fi
