name: Main pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ '*' ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      type:
        description: 'Release Library'
        type: choice
        required: true
        default: 'no release'
        options:
          - 'no release'
          - major
          - minor
          - patch

jobs:
  build:
    name: Build + unit tests
    uses: ./.github/workflows/callable.build.yml
    permissions:
      checks: write
    if: |
      !contains(github.event.head_commit.message, '[maven-release-plugin] prepare for next development iteration') || github.ref_type == 'tag'

  code_analysis:
    name: Code Analysis (multi)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/callable.code-analysis.yml
    needs: build

  maven_release:
    name: Create release
    uses: ./.github/workflows/callable.maven-release.yml
    secrets: inherit
    needs:
      - build
      - code_analysis
    permissions:
      contents: write
    with:
      type: ${{ inputs.type }}
    if: |
      github.event_name == 'workflow_dispatch' && inputs.type != 'no release'

  publish_sonatype:
    name: Publish artifact (Maven Central)
    uses: ./.github/workflows/callable.publish-sonatype.yml
    secrets: inherit
    needs:
      - build
      - code_analysis
    if: |
      (
        github.event_name != 'workflow_dispatch' || inputs.type == 'no release'
      ) && (
        github.ref == 'refs/heads/main' || github.ref_type == 'tag'
      )

  publish_docs:
    name: Publish docs (GitHub Pages)
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/callable.publish-docs.yml
    needs: build
    if: |
      github.ref == 'refs/heads/main'
      && ( github.event_name != 'workflow_dispatch' || inputs.type == 'no release' )
